[workspace]
resolver = "3"
members = ["crates/zipp", "crates/zipp-seo", "crates/zipp-agent", "crates/zipp-forms", "crates/zipp-members", "example/cms"]

# the crates are released together, in one version
[workspace.package]
version = "0.2.0"
edition = "2024"
# async-graphql 7.2 needs 1.89
rust-version = "1.89"
license = "MIT OR Apache-2.0"
repository = "https://github.com/zipp-cms/zipp-next"
homepage = "https://github.com/zipp-cms/zipp-next"
authors = ["Sören Meier <soeren@s-me.ch>"]
