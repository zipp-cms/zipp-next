[package]
name = "zipp-cms"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "A headless cms where the content model is code: an api, a studio, migrations and TypeScript types from a Rust schema"
readme = "README.md"
keywords = ["cms", "headless-cms", "graphql", "axum", "sqlite"]
categories = ["web-programming::http-server", "web-programming"]

[lib]
# the package is zipp-cms (zipp is taken), the code says zipp
name = "zipp"

[package.metadata.docs.rs]
all-features = true

[dependencies]
async-graphql = { version = "7", features = ["dynamic-schema", "dataloader"] }
async-graphql-axum = "7"
axum = { version = "0.8.4", features = ["macros", "multipart"] }
bcrypt = "0.17"
clap = { version = "4.5", features = ["derive", "env"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif"] }
lettre = { version = "0.11.23", default-features = false, features = ["builder", "hostname", "pool", "smtp-transport", "tokio1-rustls", "aws-lc-rs", "webpki-roots"] }
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
rand = "0.9.2"
sha2 = "0.11"
soe-llms = "0.0.16"
rusqlite = { version = "0.37", features = ["backup", "bundled", "trace"] }
rust-embed = "8"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
serde_urlencoded = "0.7"
tempfile = "3"
thiserror = "2.0"
tokio = { version = "1.45", features = ["rt-multi-thread", "macros", "net", "fs", "io-util"] }
tokio-stream = "0.1"
tokio-util = { version = "0.7", features = ["io"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6.6", features = ["cors", "fs", "limit", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# lossy WebP from libwebp (C, built by cc): image only encodes lossless
# WebP, which is four times the size of a jpeg for photos
webp = { version = "0.3", default-features = false }
# deflate with the flate2 that image's png brings (miniz_oxide)
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }

[features]
# `zipp::testing`: a test server for the tests of sites and plugins
testing = []
# `import-craft`: the import of a Craft site, for the crate of a port
craft = []
