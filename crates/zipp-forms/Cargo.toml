[package]
name = "zipp-forms"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "Forms of the website for zipp, like Craft's Contact Form: declared in code, sent by mail"
readme = "README.md"
keywords = ["cms", "forms", "contact-form", "zipp"]
categories = ["web-programming"]
exclude = ["studio/"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
tracing = "0.1"
zipp = { package = "zipp-cms", path = "../zipp", version = "0.1.0" }

[dev-dependencies]
zipp = { package = "zipp-cms", path = "../zipp", version = "0.1.0", features = ["testing"] }
tokio = { version = "1.45", features = ["rt-multi-thread", "macros"] }
