[package]
name = "zipp-forms"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "Forms of the website for zipp, like Formie: built in the studio, submissions stored"
readme = "README.md"
keywords = ["cms", "forms", "form-builder", "zipp"]
categories = ["web-programming"]
exclude = ["studio/", "crelte/"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
zipp = { package = "zipp-cms", path = "../zipp", version = "0.3.0" }

[dev-dependencies]
zipp = { package = "zipp-cms", path = "../zipp", version = "0.3.0", features = ["testing"] }
tokio = { version = "1.45", features = ["rt-multi-thread", "macros"] }
