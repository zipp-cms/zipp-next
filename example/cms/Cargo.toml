[package]
name = "example-cms"
version.workspace = true
edition.workspace = true
publish = false

[dependencies]
serde_json = "1.0"
zipp = { package = "zipp-cms", path = "../../crates/zipp" }
zipp-forms = { path = "../../crates/zipp-forms" }
zipp-seo = { path = "../../crates/zipp-seo" }

[dev-dependencies]
tokio = { version = "1.45", features = ["rt-multi-thread", "macros"] }
zipp = { package = "zipp-cms", path = "../../crates/zipp", features = ["testing"] }
