query ($siteId: [QueryArgument], $where: [Where!]) {
	events: entries(
		type: "event"
		siteId: $siteId
		where: $where
		order: "date"
	) {
		title
		url
		... on event_Entry {
			date
			city
			soldOut
			genre {
				value
				label
				color
			}
			image {
				url(transform: "thumb")
				alt
			}
		}
	}
}
