# globals are singles in zipp, globalSet finds them like in Craft
query ($siteId: [QueryArgument]) {
	header: globalSet(handle: "header", siteId: $siteId) {
		... on header_Entry {
			navigation {
				title
				url
			}
		}
	}
	footer: globalSet(handle: "footer", siteId: $siteId) {
		... on footer_Entry {
			text
		}
	}
}
