# globals are singles in zipp, globalSet finds them like in Craft
query ($siteId: [QueryArgument]) {
	header: globalSet(handle: "header", siteId: $siteId) {
		... on header_Entry {
			navigation {
				url
				label
				defaultLabel
				target
				children {
					url
					label
					defaultLabel
					target
				}
			}
		}
	}
	# the texts for crelte's translations plugin
	translations: translations(siteId: $siteId) {
		common
	}
	footer: globalSet(handle: "footer", siteId: $siteId) {
		... on footer_Entry {
			text
			links {
				label
				url
			}
		}
	}
}
