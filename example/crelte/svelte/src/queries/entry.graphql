# the same query crelte runs against Craft: zipp answers it in Craft's shape
fragment Image on Asset {
	url(transform: "medium")
	srcset(transforms: ["small", "medium"])
	width(transform: "medium")
	height(transform: "medium")
	alt
	credit
}

fragment Hero on Asset {
	url(transform: "hero")
	srcset(transforms: ["small", "hero"], format: "webp")
	width(transform: "hero")
	height(transform: "hero")
	alt
}

# a page starts with its intro, like the crelte tutorial
fragment Intro on Entry {
	title
	... on home_Entry {
		intro {
			html
		}
		hero {
			...Hero
		}
	}
	... on page_Entry {
		intro {
			html
		}
		hero {
			...Hero
		}
	}
	... on news_Entry {
		intro {
			html
		}
		hero {
			...Hero
		}
	}
	... on article_Entry {
		intro {
			html
		}
		hero {
			...Hero
		}
	}
}

fragment Content on Block {
	typeHandle
	... on text_Block {
		text {
			chunks {
				... on Html {
					html
				}
				... on Buttons {
					buttons {
						url
						label
						defaultLabel
						target
					}
				}
				... on images_Block {
					caption
					width
					images {
						...Image
					}
				}
			}
		}
	}
	... on images_Block {
		caption
		width
		images {
			...Image
		}
	}
	... on video_Block {
		loop
		video {
			url
			mimeType
		}
		poster {
			url(transform: "medium")
		}
	}
	... on button_Block {
		link {
			url
			label
			defaultLabel
			target
		}
	}
	... on events_Block {
		city
	}
	... on contact_Block {
		title
	}
}

query ($uri: [String], $siteId: [QueryArgument]) {
	entry(uri: $uri, siteId: $siteId) {
		id
		seoJson
		siteId
		url
		# the same page in the other languages, for the switch in the header
		localized {
			siteId
			url
		}
		sectionHandle
		typeHandle
		title
		...Intro
		... on home_Entry {
			content {
				...Content
			}
		}
		... on page_Entry {
			content {
				...Content
			}
			children {
				title
				url
			}
		}
		... on article_Entry {
			postDate
			categories {
				id
				title
			}
			content {
				...Content
			}
		}
		... on event_Entry {
			date
			city
			spokenIn
			tickets {
				price
				soldOut
				categories {
					name
					price
					soldOut
				}
			}
			genre {
				value
				label
				color
			}
			description {
				html
			}
			image {
				...Hero
			}
			page {
				title
				url
			}
		}
	}
}
